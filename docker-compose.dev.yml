name: vocabulary-trainer-dev

x-app-env: &app-env
  DB_HOST: db
  DB_NAME: vocabulary_trainer
  DB_PASS: root
  DB_USER: postgres
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV: development
  POSTGRES_DATABASE: vocabulary_trainer
  POSTGRES_HOST: db
  POSTGRES_PASSWORD: root
  POSTGRES_URL: "postgresql://postgres:root@db:5432/vocabulary_trainer?sslmode=disable"
  POSTGRES_URL_NON_POOLING: "postgresql://postgres:root@db:5432/vocabulary_trainer?sslmode=disable"
  POSTGRES_USER: postgres
  USE_LOCAL_POSTGRES: "true"
  WATCHPACK_POLLING: "true"
  CHOKIDAR_USEPOLLING: "true"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vocabulary_trainer
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocabulary_trainer"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm seed:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    restart: "no"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm dev --hostname 0.0.0.0 --port 3000
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - next_cache:/app/.next
      - node_modules:/app/node_modules

volumes:
  next_cache:
  node_modules:
  postgres_data:
